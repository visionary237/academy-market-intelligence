[project]
name = "academy-edstats"
version = "0.1.0"
description = "Analyse des marchés internationaux pour academy à partir des données EdStats"
requires-python = ">=3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.4.6",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
